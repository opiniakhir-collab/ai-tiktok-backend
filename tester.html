<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Runway API Tester</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #1d1d1d;
      padding: 25px;
      border-radius: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #252525;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      background: #000;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: monospace;
    }

    .success {
      color: #4ade80;
    }

    .error {
      color: #ff5555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>🎬 Runway API Tester</h1>

  <label>Backend URL</label>

  <input
    id="backendUrl"
    value="https://ai-tiktok-backend.opiniakhir.workers.dev"
  >

  <button onclick="checkBackend()">
    ❤️ Cek Backend
  </button>


  <label>Image URL</label>

  <input
    id="imageUrl"
    placeholder="https://contoh.com/gambar.jpg"
  >


  <label>Prompt</label>

  <textarea
    id="prompt"
    placeholder="A person walking naturally toward the camera, cinematic movement"
  ></textarea>


  <label>Ratio</label>

  <select id="ratio">
    <option value="720:1280">720:1280 (TikTok)</option>
    <option value="1280:720">1280:720</option>
    <option value="832:1104">832:1104</option>
    <option value="1104:832">1104:832</option>
    <option value="960:960">960:960</option>
  </select>


  <label>Duration</label>

  <select id="duration">
    <option value="5">5 detik</option>
    <option value="6">6 detik</option>
    <option value="8">8 detik</option>
    <option value="10">10 detik</option>
  </select>


  <button onclick="generateVideo()">
    🚀 Generate Video
  </button>


  <div id="result">
    Hasil akan muncul di sini...
  </div>

</div>


<script>

function getBackendUrl() {

  let url = document
    .getElementById("backendUrl")
    .value
    .trim();

  return url.replace(/\/+$/, "");
}


function showResult(message, success = false) {

  const result = document.getElementById("result");

  result.className = success
    ? "success"
    : "error";

  result.textContent = message;
}


/* ============================
   CEK BACKEND
============================ */

async function checkBackend() {

  showResult("⏳ Menghubungkan ke backend...");

  const backend = getBackendUrl();

  try {

    const response = await fetch(
      backend + "/",
      {
        method: "GET",
        mode: "cors",
        cache: "no-store"
      }
    );

    const text = await response.text();

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "\n" +
        text
      );

    }

    let data;

    try {
      data = JSON.parse(text);
    } catch {
      data = text;
    }

    showResult(
      "✅ BACKEND TERHUBUNG\n\n" +
      JSON.stringify(data, null, 2),
      true
    );

  } catch (error) {

    showResult(
      "❌ GAGAL TERHUBUNG\n\n" +
      error.message +
      "\n\nBackend yang digunakan:\n" +
      backend
    );

  }
}


/* ============================
   GENERATE VIDEO
============================ */

async function generateVideo() {

  const backend = getBackendUrl();

  const imageUrl =
    document.getElementById("imageUrl").value.trim();

  const prompt =
    document.getElementById("prompt").value.trim();

  const ratio =
    document.getElementById("ratio").value;

  const duration =
    Number(
      document.getElementById("duration").value
    );


  if (!imageUrl) {

    showResult(
      "❌ Image URL wajib diisi."
    );

    return;
  }


  if (!prompt) {

    showResult(
      "❌ Prompt wajib diisi."
    );

    return;
  }


  showResult(
    "⏳ Mengirim request ke Runway..."
  );


  try {

    const response = await fetch(
      backend + "/generate-video",
      {
        method: "POST",

        mode: "cors",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          imageUrl: imageUrl,

          prompt: prompt,

          ratio: ratio,

          duration: duration

        })
      }
    );


    const text =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(text);

    } catch {

      data =
        {
          raw: text
        };

    }


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status +
        "\n\n" +
        JSON.stringify(
          data,
          null,
          2
        )
      );

    }


    showResult(
      "✅ REQUEST BERHASIL\n\n" +
      JSON.stringify(
        data,
        null,
        2
      ),
      true
    );


  } catch (error) {

    showResult(
      "❌ GAGAL GENERATE VIDEO\n\n" +
      error.message +
      "\n\nBackend:\n" +
      backend
    );

  }

}

</script>

</body>
</html>
